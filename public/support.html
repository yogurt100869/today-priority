  <title>今日优先支持</title>
  <style>
    body{max-width:720px;margin:40px auto;padding:0 20px;color:#242534;font:16px/1.7 system-ui;background:#f7f7fb}
    main{padding:24px;border-radius:16px;background:#fff}h1{color:#181925}

<body><main>
  <h1>今日优先支持</h1>
  <p>今日优先是一款本地优先的提醒与打卡应用。</p>
  <h2>常见问题</h2>
  <p><strong>数据保存在哪里？</strong><br>数据只保存在当前设备的应用私有空间。</p>
  <p><strong>如何备份？</strong><br>打开“我的 → 导出个人数据”，使用系统分享菜单保存 JSON 文件。</p>
  <p><strong>为什么没有收到提醒？</strong><br>请在 iPhone“设置 → 通知 → 今日优先”中允许通知，并确认项目已启用提醒。</p>
  <p><strong>如何删除数据？</strong><br>可以在计划页删除项目；删除 App 会删除全部本地数据。</p>
</main></body>
</html>
